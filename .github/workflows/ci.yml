name: workbench
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check CI preparation contract
        run: python scripts/check_ci_readiness.py --public-checkout --out artifacts/ci-readiness
        timeout-minutes: 2
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-web-lock.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Fetch fixed demonstration paper from its original source
        run: .venv/bin/python scripts/fetch_demo_paper.py --out artifacts/ci-paper-bootstrap
        timeout-minutes: 2
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Full isolated software acceptance
        run: .venv/bin/python scripts/verify_release.py --out artifacts/ci-acceptance --browser-channel chromium
        timeout-minutes: 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci-readiness/result.json
            artifacts/ci-paper-bootstrap/result.json
            artifacts/ci-acceptance/acceptance.json
            artifacts/ci-acceptance/*.log
            artifacts/ci-acceptance/**/result.json
            artifacts/ci-acceptance/**/*.log
