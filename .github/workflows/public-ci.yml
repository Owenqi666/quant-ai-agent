name: public-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENBLAS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  verify:
    name: Ubuntu 24.04 / Python 3.14 / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-web-lock.txt
            pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - name: Record actual toolchain
        run: |
          set -euo pipefail
          mkdir -p .ci/logs .ci/reliability
          git rev-parse HEAD | tee .ci/logs/checkout-sha.log
          python --version 2>&1 | tee .ci/logs/python-version.log
          node --version 2>&1 | tee .ci/logs/node-version.log
          npm --version 2>&1 | tee .ci/logs/npm-version.log
      - name: Install locked Python dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-web-lock.txt 2>&1 | tee .ci/logs/python-install.log
          .venv/bin/python -m pip install --no-deps -e . 2>&1 | tee .ci/logs/python-project-install.log
      - name: Verify checked-in API contracts
        run: |
          set -euo pipefail
          .venv/bin/python scripts/export_api_contract.py --check 2>&1 | tee .ci/logs/api-contract.log
      - name: Run public software and reliability tests
        env:
          PUBLIC_RELIABILITY_ARTIFACT_DIR: .ci/reliability
          CORR_COMPATIBILITY_REPORT: .ci/corr-compatibility.json
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_public_tests.py --output .ci/python-tests.json 2>&1 | tee .ci/logs/python-tests.log
      - name: Compare and measure rolling-correlation smoke cases
        run: |
          set -euo pipefail
          .venv/bin/python scripts/benchmark_ts_corr.py --suite smoke --warmups 5 --repeats 5 --output-dir .ci/ts-corr-smoke 2>&1 | tee .ci/logs/ts-corr-smoke.log
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee ../.ci/logs/frontend-install.log
      - name: Check frontend types
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../.ci/logs/frontend-typecheck.log
      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../.ci/logs/frontend-build.log
      - name: Test frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../.ci/logs/frontend-tests.log
      - name: Run original fixture agent demonstration
        run: |
          set -euo pipefail
          .venv/bin/python scripts/demo_public_agent.py --output-dir .demo/agent 2>&1 | tee .ci/logs/agent-demo.log
      - name: Independently check demonstration artifacts
        run: |
          set -euo pipefail
          .venv/bin/python scripts/check_public_agent_demo.py --output-dir .demo/agent 2>&1 | tee .ci/logs/agent-check.log
      - name: Upload selected software evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .ci/logs/*.log
            .ci/python-tests.json
            .ci/corr-compatibility.json
            .ci/ts-corr-smoke/benchmark.json
            .ci/ts-corr-smoke/report.md
            .ci/reliability/*.json
            .ci/reliability/original-fixture.pdf
            .demo/agent/demo-summary.json
            .demo/agent/failure.json
            .demo/agent/spec.json
            .demo/agent/paper.pdf
            .demo/agent/paper.json
            .demo/agent/paper-selection.json
            .demo/agent/input/market.csv
            .demo/agent/input/metadata.json
            .demo/agent/input/evaluation.json
            .demo/agent/input/registration.json
            .demo/agent/proposals/invalid/request.json
            .demo/agent/proposals/invalid/prompt.txt
            .demo/agent/proposals/invalid/context.json
            .demo/agent/proposals/invalid/raw-response.json
            .demo/agent/proposals/invalid/status.json
            .demo/agent/proposals/extract/request.json
            .demo/agent/proposals/extract/prompt.txt
            .demo/agent/proposals/extract/context.json
            .demo/agent/proposals/extract/raw-response.json
            .demo/agent/proposals/extract/status.json
            .demo/agent/proposals/extract/accepted-response.json
            .demo/agent/proposals/generate/request.json
            .demo/agent/proposals/generate/prompt.txt
            .demo/agent/proposals/generate/context.json
            .demo/agent/proposals/generate/raw-response.json
            .demo/agent/proposals/generate/status.json
            .demo/agent/proposals/generate/accepted-response.json
            .demo/agent/material/import.json
            .demo/agent/material/engineering-version.json
            .demo/agent/material/component-binding-version.json
            .demo/agent/experiment.json
            .demo/agent/research.json
            .demo/agent/run.json
            .demo/agent/worker/factor.csv
            .demo/agent/worker/result.json
            .demo/agent/worker/task.json
            .demo/agent/worker/report.md
            .demo/agent/worker/receipts.json
            .demo/agent/report.json
            .demo/agent/report-export.json
            .demo/agent/report.md
            .demo/agent/verification.json
